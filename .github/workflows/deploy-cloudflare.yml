# Publishes the site to Cloudflare Workers (test URL on *.workers.dev) on
# every push to main. WP Engine keeps building from the same branch on its
# own; this workflow does not touch it. See replit.md → "Cloudflare Workers".
#
# Repository settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_API_KEY
#   Variables: NEXT_PUBLIC_WORDPRESS_URL, NEXT_PUBLIC_SITE_URL,
#              NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_FIREBASE_VAPID_KEY (optional)
# Runtime secrets (Stripe, Recombee, Resend, R2, ...) are NOT set here: they
# live on the Worker itself (dashboard or `wrangler secret put`) and survive
# deploys.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inlined into the bundle at build time (next.config.js / NEXT_PUBLIC_*).
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      NEXT_PUBLIC_WORDPRESS_URL: ${{ vars.NEXT_PUBLIC_WORDPRESS_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Until the Cloudflare secrets exist, pushes to main skip this job with a
      # warning instead of failing.
      - name: Check Cloudflare credentials
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Workers deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NEXT_PUBLIC_WORDPRESS_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_WORDPRESS_URL is not set."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # package.json pins npm >=11.5 (npm 10 can die mid-install, see replit.md).
      - name: Install npm 11
        if: steps.guard.outputs.enabled == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      # Builds with OpenNext (CLOUDFLARE_BUILD=1), uploads the prerendered ISR
      # pages to the R2 cache, then deploys the Worker.
      - name: Build and deploy
        if: steps.guard.outputs.enabled == 'true'
        run: npm run deploy:cf
